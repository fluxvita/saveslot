id: 1a
title: 发现数据 · 基本
stage: P1
clock: "2026-11-10T09:00:00+08:00"

fixture:
  slots:
    - name: health
      template: running
      timezone: Asia/Shanghai
  connections:
    - key: A
      name: "MacBook · Claude Code"
      scopes: [saveslot.read, saveslot.write]
    - key: seed
      name: "种子数据"
      scopes: [saveslot.read, saveslot.write]
  seed:
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天跑了 7 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@month-4", distance: { value: "7", unit: km } }
      bind: { run_1028: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "跑了 8 公里，50 分钟，很轻松" }]
        ops:
          - intent: insert
            table: health.runs
            set:
              {
                date: "@month",
                distance: { value: "8", unit: km },
                duration: { value: "50", unit: min },
                feeling: "很轻松",
              }
      bind: { run_1101: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天跑了 15 公里，腿有点酸" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@month+2", distance: { value: "15", unit: km }, feeling: "腿有点酸" }
      bind: { run_1103: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天 6 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@month+4", distance: { value: "6", unit: km } }
      bind: { run_1105: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "周日跑了 10 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@month+7", distance: { value: "10", unit: km } }
      bind: { run_1108: "ops[0].target.row" }

steps:
  - agent: A
    new_session: true
    user: "我这个月跑了多少？"

assert:
  calls:
    - level: H
      text: "必须：至少一次 `saveslot_catalog`，且它早于第一次 `saveslot_query` / `saveslot_sql`。"
      order:
        - { tool: saveslot_catalog }
        - { tool: { in: [saveslot_query, saveslot_sql] } }
    - level: H
      text: "必须：至少一次 `saveslot_query` 或 `saveslot_sql`，目标是 `runs` 或 `weekly_mileage`。"
      must:
        - tool: saveslot_query
          args: { table: { in: [health.runs, health.weekly_mileage, runs, weekly_mileage] } }
        - tool: saveslot_sql
          args: { sql: { in: [{ contains: runs }, { contains: weekly_mileage }] } }
    - level: H
      text: "不得：任何 `saveslot_write`、`saveslot_resolve`、`saveslot_schema_draft`、`saveslot_delete`。"
      must_not:
        tool: { in: [saveslot_write, saveslot_resolve, saveslot_schema_draft, saveslot_delete] }
  state:
    - level: H
      text: "`ops_since_seed`：没有新操作。"
      ops_since_seed: {}
      expect: { total: 0 }
    - level: H
      text: "`reads`：连接实例 A 有 `catalog` 与 `query` 或 `sql` 的读取记录。"
      reads: { connection: A }
      expect: { operations: [catalog, { in: [query, sql] }] }
  reply:
    - level: R
      mentions: [{ value: 39, unit: [km, 公里] }]
    - level: R
      rubric: "没有把距离说成别的单位，也没有把上个月的记录算进去"
