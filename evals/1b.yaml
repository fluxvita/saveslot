id: 1b
title: 发现数据 · 派生表
stage: P1
clock: "2026-11-10T09:00:00+08:00"

fixture:
  slots:
    - name: health
      template: running
      timezone: Asia/Shanghai
  connections:
    - key: A
      name: "MacBook · Claude Code"
      scopes: [saveslot.read, saveslot.write]
    - key: seed
      name: "种子数据"
      scopes: [saveslot.read, saveslot.write]
  seed:
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天跑了 7 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-12", distance: { value: "7", unit: km } }
      bind: { run_1028: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "跑了 8 公里，50 分钟，很轻松" }]
        ops:
          - intent: insert
            table: health.runs
            set:
              {
                date: "@week-8",
                distance: { value: "8", unit: km },
                duration: { value: "50", unit: min },
                feeling: "很轻松",
              }
      bind: { run_1101: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天跑了 15 公里，腿有点酸" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-6", distance: { value: "15", unit: km }, feeling: "腿有点酸" }
      bind: { run_1103: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天 6 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-4", distance: { value: "6", unit: km } }
      bind: { run_1105: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "周日跑了 10 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-1", distance: { value: "10", unit: km } }
      bind: { run_1108: "ops[0].target.row" }

steps:
  - agent: A
    new_session: true
    user: "我上周跑量是多少？"

assert:
  calls:
    - level: H
      text: "必须：至少一次 `saveslot_catalog`，且它早于第一次 `saveslot_query` / `saveslot_sql`。"
    - level: H
      text: "必须：至少一次 `saveslot_query` 或 `saveslot_sql`，目标是 `runs` 或 `weekly_mileage`。"
    - level: H
      text: "不得：任何 `saveslot_write`、`saveslot_resolve`、`saveslot_schema_draft`、`saveslot_delete`。"
    - level: H
      text: "另记录走了哪条路：读 `weekly_mileage`，还是对 `runs` 求和。两条都可接受。"
  state:
    - level: H
      text: "同 1a：`ops_since_seed`：没有新操作。"
    - level: H
      text: "同 1a：`reads`：连接实例 A 有 `catalog` 与 `query` 或 `sql` 的读取记录。"
  reply:
    - level: R
      mentions: [{ value: 31, unit: [km, 公里] }]
