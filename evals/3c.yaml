id: 3c
title: 冲突 · 撤销遇上并发修改
stage: P1
clock: "2026-11-10T18:00:00+08:00"

fixture:
  slots:
    - name: ledger
      template: spending
      timezone: Asia/Shanghai
  connections:
    - key: A
      name: "MacBook · Claude Code"
      scopes: [saveslot.read, saveslot.write]
    - key: B
      name: "MacBook · Codex"
      scopes: [saveslot.read, saveslot.write]
  seed:
    - as: A
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天午饭花了 45 元" }]
        ops:
          - intent: insert
            table: ledger.expenses
            set: { date: "2026-11-10", category: 餐饮, amount: { value: "45", unit: CNY } }
      bind: { lunch: "ops[0].target.row", lunch_ver: "ops[0].ver" }
    - as: A
      op: write
      params:
        evidence: [{ kind: user_message, text: "不对，午饭是 54 元" }]
        ops:
          - intent: correct
            table: ledger.expenses
            row: $lunch
            ver: $lunch_ver
            set: { amount: { value: "54", unit: CNY } }
    - as: B
      op: write
      params:
        evidence: [{ kind: user_message, text: "打车花了 30 元" }]
        ops:
          - intent: insert
            table: ledger.expenses
            set: { date: "2026-11-10", category: 交通, amount: { value: "30", unit: CNY } }
      bind: { taxi: "ops[0].target.row" }

steps:
  - agent: A
    new_session: true
    user: "今天打车那笔记的是多少？"
  - script:
      - as: B
        op: query
        params: { table: ledger.expenses, where: [{ field: category, op: "=", value: 交通 }] }
        bind: { taxi_ver_b: "rows[0].ver" }
      - as: B
        op: write
        params:
          evidence: [{ kind: user_message, text: "打车其实是 35 元" }]
          ops:
            - intent: correct
              table: ledger.expenses
              row: $taxi
              ver: $taxi_ver_b
              set: { amount: { value: "35", unit: CNY } }
  - agent: A
    user: "这笔不要了，删掉吧"

assert:
  calls:
    - level: H
      text: '必须（两条路之一）——甲：第 3 步里 `saveslot_write`，`intent: "revoke"`，结果 `status: "pending"`，`ops[0].fields["*"].result: "candidate"`。乙：第 3 步里重新读取（`query` 或 `history`）看到 35，第 3 步里没有以 `taxi` 为目标的 `saveslot_write`。'
      step: 3
      any_of:
        - path: 甲
          must:
            tool: saveslot_write
            args: { "ops[*].intent": revoke }
            result: { status: pending, 'ops[0].fields["*"].result': candidate }
        - path: 乙
          all_of:
            - must:
                - tool: saveslot_query
                  result:
                    "rows[*]":
                      { row: $taxi, "values.amount": { quantity: { value: 35, unit: CNY } } }
                - tool: saveslot_history
                  result:
                    "target.row": $taxi
                    "entries[*].fields.amount.after": { quantity: { value: 35, unit: CNY } }
            - must_not:
                tool: saveslot_write
                args: { "ops[*].row": $taxi }
    - level: S
      text: "不得：`saveslot_delete`；`saveslot_sources` 的 `deletion_preview` 模式。"
      must_not:
        - { tool: saveslot_delete }
        - { tool: saveslot_sources, args: { mode: deletion_preview } }
    - level: S
      text: "不得：第 3 步里出现让这一行被撤销的第二次写入或 `saveslot_resolve`。"
      step: 3
      all_of:
        - count:
            of: { tool: saveslot_write, args: { "ops[*].intent": revoke } }
            max: 1
        - must_not: { tool: saveslot_resolve }
  state:
    - level: H
      text: '`taxi` 仍存在（不带 `include_revoked` 能查到），amount 35 CNY。甲：`marks.disputed` 的 `fields` 是 `["*"]`。乙：`marks` 没有 `disputed`。'
      any_of:
        - path: 甲
          query: { table: ledger.expenses, row: $taxi }
          expect:
            count: 1
            rows:
              - values: { amount: { quantity: { value: 35, unit: CNY } } }
                "marks.disputed[*].fields": ["*"]
        - path: 乙
          query: { table: ledger.expenses, row: $taxi }
          expect:
            count: 1
            rows:
              - values: { amount: { quantity: { value: 35, unit: CNY } } }
                marks: { lacks: [disputed] }
  reply:
    - level: R
      rubric: "告诉用户这一行在他读取之后被另一个 Agent（或另一个连接实例）改过，金额改成了 35，还没有撤销（甲：撤销没有生效），并问用户是否仍要撤销"
