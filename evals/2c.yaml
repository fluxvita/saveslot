id: 2c
title: 纠正一条记录 · 指代不明
stage: P1
clock: "2026-11-10T09:00:00+08:00"

fixture:
  slots:
    - name: health
      template: running
      timezone: Asia/Shanghai
  connections:
    - key: A
      name: "MacBook · Claude Code"
      scopes: [saveslot.read, saveslot.write]
    - key: seed
      name: "种子数据"
      scopes: [saveslot.read, saveslot.write]
  seed:
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天跑了 7 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-12", distance: { value: "7", unit: km } }
      bind: { run_1028: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "跑了 8 公里，50 分钟，很轻松" }]
        ops:
          - intent: insert
            table: health.runs
            set:
              {
                date: "@week-8",
                distance: { value: "8", unit: km },
                duration: { value: "50", unit: min },
                feeling: "很轻松",
              }
      bind: { run_1101: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天跑了 15 公里，腿有点酸" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-6", distance: { value: "15", unit: km }, feeling: "腿有点酸" }
      bind: { run_1103: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天 6 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-4", distance: { value: "6", unit: km } }
      bind: { run_1105: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "周日跑了 10 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-1", distance: { value: "10", unit: km } }
      bind: { run_1108: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "晚上又慢跑了 3 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-6", distance: { value: "3", unit: km } }
      bind: { run_1103b: "ops[0].target.row" }

steps:
  - agent: A
    new_session: true
    user: "{@week-6} 那次记错了，是 5 公里"
  - agent: A
    user: "是 15 公里那次"

assert:
  calls:
    - level: S
      text: "不得：在第 2 步之前出现任何 `saveslot_write`。"
    - level: H
      text: "必须：第 2 步之后 `saveslot_write` 的目标是 `run_1103`。"
  state:
    - level: H
      text: "`run_1103` 的 distance 是 5 km；`run_1103b` 仍是 3 km。"
  reply:
    - level: R
      step: 1
      rubric: "指出 {@week-6} 有两条记录，并问用户指的是哪一条"
