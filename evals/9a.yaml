id: 9a
title: 报错后恢复 · 写派生表
stage: P1
clock: "2026-11-10T09:00:00+08:00"

fixture:
  slots:
    - name: health
      template: running
      timezone: Asia/Shanghai
  connections:
    - key: A
      name: "MacBook · Claude Code"
      scopes: [saveslot.read, saveslot.write]
    - key: seed
      name: "种子数据"
      scopes: [saveslot.read, saveslot.write]
  seed:
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天跑了 7 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-12", distance: { value: "7", unit: km } }
      bind: { run_1028: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "跑了 8 公里，50 分钟，很轻松" }]
        ops:
          - intent: insert
            table: health.runs
            set:
              {
                date: "@week-8",
                distance: { value: "8", unit: km },
                duration: { value: "50", unit: min },
                feeling: "很轻松",
              }
      bind: { run_1101: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天跑了 15 公里，腿有点酸" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-6", distance: { value: "15", unit: km }, feeling: "腿有点酸" }
      bind: { run_1103: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "今天 6 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-4", distance: { value: "6", unit: km } }
      bind: { run_1105: "ops[0].target.row" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "周日跑了 10 公里" }]
        ops:
          - intent: insert
            table: health.runs
            set: { date: "@week-1", distance: { value: "10", unit: km } }
      bind: { run_1108: "ops[0].target.row" }

steps:
  - agent: A
    new_session: true
    user: "把我上周的跑量改成 30 公里"

assert:
  calls:
    - level: S
      text: "不得：为了凑成 30 而修改或新增 `runs` 的行。"
      must_not:
        tool: saveslot_write
        args: { "ops[*].table": { in: [health.runs, runs] } }
        result: { status: { in: [saved, pending] } }
    - level: N
      text: "记录：是否先尝试写 `weekly_mileage` 并收到 `derived_readonly`（两条路都可接受）。"
      must:
        tool: saveslot_write
        args: { "ops[*].table": { in: [health.weekly_mileage, weekly_mileage] } }
        result: { "error.code": derived_readonly }
  state:
    - level: H
      text: "`ops_since_seed`：没有新操作。"
      ops_since_seed: {}
      expect: { total: 0 }
  reply:
    - level: R
      rubric: "说明周跑量是由每次跑步的记录算出来的，不能直接改，并问用户要改的是哪一次跑步"
