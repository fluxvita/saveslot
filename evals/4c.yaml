id: 4c
title: 状态类写入 · 现在这档记错了
stage: P1
clock: "2026-11-05T10:00:00+08:00"

fixture:
  slots:
    - name: plan
      template: budget
      timezone: Asia/Shanghai
  connections:
    - key: A
      name: "MacBook · Claude Code"
      scopes: [saveslot.read, saveslot.write]
    - key: B
      name: "MacBook · Codex"
      scopes: [saveslot.read, saveslot.write]
    - key: seed
      name: "种子数据"
      scopes: [saveslot.read, saveslot.write]
  seed:
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "餐饮预算从 10 月 1 号起每月 5000" }]
        ops:
          - intent: update
            table: plan.budgets
            entity_key: { category: 餐饮 }
            valid_from: "2026-10-01"
            set: { amount: { value: "5000", unit: CNY } }
      bind: { budget_food: "ops[0].target.entity", budget_food_ver: "ops[0].ver", w_5000: "seq" }
    - as: seed
      op: write
      params:
        evidence: [{ kind: user_message, text: "11 月 10 号起餐饮预算降到 4000" }]
        ops:
          - intent: update
            table: plan.budgets
            entity: $budget_food
            ver: $budget_food_ver
            valid_from: "2026-11-10"
            set: { amount: { value: "4000", unit: CNY } }
      bind: { w_4000: "seq" }

steps:
  - agent: A
    new_session: true
    user: "现在这档餐饮预算记错了，应该是 6000"

assert:
  calls:
    - level: H
      text: '必须：`saveslot_write`，`intent: "correct"`，`valid_from`、`valid_to` 都没传，amount 6000，带读到的 `ver`。'
    - level: H
      text: '不得：`intent: "update"`；`valid_from` 是 2026-11-05。'
    - level: H
      text: '可接受：多数 Agent 都显式传区间，且传得对（`valid_from: 10-01`）——状态与期望相同即通过。记进"走了哪条路"。'
  state:
    - level: H
      text: "`spans`：`[10-01, 11-10)` 6000，`[11-10, ∞)` 4000。"
  reply:
    - level: R
      rubric: "告诉用户改的是 10 月 1 日到 11 月 9 日这一整段，11 月 10 日起的 4000 没有动"
