# Secret scanning (the `secrets` CI job runs gitleaks with this file): its default rules, and the
# saveslot tokens (docs/zh-CN/spec/04-contract.md §12): a prefix and 43 base64url characters.
# No word boundary on either side: a token glued to other characters (after an escaped `\n`, a
# `%20`, `SAVESLOT_`, or before `_backup`) is still a token. RE2 syntax, no lookaround.

[extend]
useDefault = true

[[rules]]
id = "saveslot-connection-token"
description = "saveslot connection instance token"
regex = '''slt_[A-Za-z0-9_-]{43}'''
keywords = ["slt_"]

[[rules]]
id = "saveslot-session-token"
description = "saveslot user session token"
regex = '''sls_[A-Za-z0-9_-]{43}'''
keywords = ["sls_"]

# The samples of a storage format (docs/zh-CN/process/decisions/data-compatibility.md §4): data
# written once by a release and kept for the tests of every later one. A sample holds the
# credentials of its own throwaway tenants (the server sample's `expected.json` has the user
# sessions issued when it was made, which a reader must still be let in with); they open nothing
# but the sample, in tests. By path only, and no further than the samples' directory.
[allowlist]
description = "storage format samples: credentials of throwaway sample tenants, used in tests only"
paths = ['''^packages/test-backend/fixtures/storage-format/''']
