# CI only calls scripts from the repository (package.json), so the checks stay the same when the
# project moves to another CI platform. See docs/zh-CN/spec/02-architecture.md §11.
#
# The full check (`pnpm check`) is not run on merge requests: the author runs it on the head before
# pushing and puts the result in the description, and the reviewer runs it again on the head to be
# merged. CI runs it after a merge, every night, and when a phase is finished (a pipeline started by
# hand on the default branch). Merge requests get the quick checks only.
#
#   merge request:          secrets, forbidden-terms, mr-title, dco; age-interop when the request
#                           changes packages/cli/src/export-crypto*, pnpm-lock.yaml or this file
#   default branch, push:   secrets, forbidden-terms, the check jobs (node:24.22.3); all
#                           interruptible
#   schedule (nightly):     the check jobs, the check-26 jobs, prop-soak, test-postgres,
#                           age-interop
#   by hand (web, api) on the default branch: the check jobs, the check-26 jobs, prop-soak,
#                           test-postgres, secrets, forbidden-terms, age-interop
#
# The check jobs are `pnpm check` as three: check-static, check-unit, check-prop. The check-26
# jobs are the same three on the 26 LTS line (package.json `engines` takes 24 and 26):
# check-26-static, -unit, -prop. A Node line `engines` does not take is not tested.
#
# The heavy jobs (the check and check-26 jobs, prop-soak, test-postgres) run one at a time in the whole
# project (`resource_group: saveslot-heavy`), so that a runner taking two jobs at once keeps the
# other slot for the quick checks; the nightly ones run one after another. On the default branch
# only the latest push runs to the end: a push's jobs are interruptible, so a newer push cancels
# them.
#
# Node is pinned to an exact version: `node:24.22.3` in every job but the check-26 ones, which run
# `node:26.13.1`. The lowest supported Node is 24.22.1 (package.json `engines`), since V8 in the
# 24 line before it can misread a one-escape object key in JSON.parse once a key of one backslash
# has been parsed in the same process (V8 commit 93cd21e8254b, backported in Node 24.22.1). To
# move to a newer Node, change the image here and `.nvmrc` together; the floor in `engines` moves
# only if the new one needs it. The check-26 image moves to a newer 26 release by hand, as the 24
# one does.
#
# A pipeline on the schedule or by hand is never cancelled by a newer commit, whether its jobs have
# started or still wait for the resource group (`workflow`: `auto_cancel: on_new_commit: none`).
# The project cancels redundant pipelines, and that cancels jobs not yet started whatever their
# `interruptible` says: without it, a merge while the nightly jobs waited cancelled them all.
#
# Tests open their stores without passing fsync to the host, unless SAVESLOT_TEST_DURABILITY is
# "host-fsync" (packages/test-backend/src/index.fixture.ts). The check on a push runs
# what the author and the reviewer ran locally; the nightly and by-hand checks set the variable, so
# that the whole suite also runs on the real fsync path.
#
# The jobs that install the workspace (the check and check-26 jobs, prop-soak, test-postgres) run it as the
# image's `node` user, not as root: root reads and writes whatever the permission bits say, so the
# tests of files and directories this user cannot read would otherwise be skipped. Only installing
# pnpm itself needs root.
#
# A runner reuses its build directory between jobs, so a job that runs as root can find the checkout
# still owned by `node`; git then refuses it ("dubious ownership"). The jobs that run git as root
# (dco, forbidden-terms, secrets) mark the checkout as safe first, and the jobs that give it to
# `node` give it back to root when they end. The first is what makes it hold: an after_script
# does not run when a job is cancelled or killed by its timeout.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# On merge requests, pushes to the default branch and by hand; not on the schedule. On a push to the
# default branch interruptible: a newer push cancels them.
.quick:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      interruptible: true
    - when: on_success

# After a merge (a push to the default branch), on the schedule and by hand; not on merge requests.
# Tests use host fsync on the schedule and by hand only. After a push interruptible: a newer push
# cancels it; on the schedule and by hand it runs to the end.
.after-merge:
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      interruptible: true
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/
      variables:
        SAVESLOT_TEST_DURABILITY: host-fsync

# On the schedule and by hand only.
.full-only:
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/

# Everything after installing pnpm runs as `node`. The checkout and the restored cache (.pnpm-store)
# are given to it first, so that it can write both and the cache is reused, not refilled each run.
.pnpm:
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - npm install --global pnpm@12.14.0
    - chown -R node:node "$CI_PROJECT_DIR"
    - uid="$(runuser -u node -- id -u)"; echo "running as uid $uid"; test "$uid" != 0
    - runuser -u node -- pnpm config set store-dir .pnpm-store
    - runuser -u node -- pnpm install --frozen-lockfile
  after_script:
    - chown -R 0:0 "$CI_PROJECT_DIR"

# For the jobs that run git as root: the checkout may be another user's (see the top of this file).
.git-as-root:
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

# `pnpm check` (type check, lint, unit and property tests, dependency rules, doc links, JSON
# examples) runs here as three jobs of the same scripts: the static checks, `test:unit`, `test:prop`.
# Each has a timeout of its own, so one part running out of time does not take the others' results
# with it. Locally `pnpm check` stays one command. On the CI runner the tests took about 15 minutes
# (`test:unit` 13, `test:prop` 4); a runner that gave a job one or two CPUs took over 35 for
# `test:unit` alone. The heavy jobs run on the CI runner only (its tag). A timeout is a hard bound
# from outside the test process: test-level limits cannot preempt synchronous code, so a stalled
# run would otherwise hold the runner until the project's default job timeout (60 minutes). One
# heavy job at a time in the project: the time spent waiting for the group is not counted in the
# timeout. Each job first prints the CPUs and the memory it can use (`ci:resources`).
.check:
  extends: [.pnpm]
  resource_group: saveslot-heavy
  tags: [fv-ci-hk-docker]

.check-static:
  extends: [.check]
  timeout: 15 minutes
  script:
    - runuser -u node -- pnpm --silent ci:resources
    - runuser -u node -- pnpm check:static

.check-unit:
  extends: [.check]
  timeout: 45 minutes
  script:
    - runuser -u node -- pnpm --silent ci:resources
    - runuser -u node -- env SAVESLOT_TEST_DURABILITY="${SAVESLOT_TEST_DURABILITY:-}" pnpm test:unit

.check-prop:
  extends: [.check]
  timeout: 25 minutes
  script:
    - runuser -u node -- pnpm --silent ci:resources
    - runuser -u node -- env SAVESLOT_TEST_DURABILITY="${SAVESLOT_TEST_DURABILITY:-}" pnpm test:prop

# On the pinned Node 24 (see the head of this file): after every merge, nightly and by hand (with host fsync).
.check-pinned:
  extends: [.after-merge]
  image: node:24.22.3

check-static:
  extends: [.check-static, .check-pinned]

check-unit:
  extends: [.check-unit, .check-pinned]

check-prop:
  extends: [.check-prop, .check-pinned]

# On the 26 LTS line: nightly and by hand (with host fsync).
.check-26:
  extends: [.full-only]
  image: node:26.13.1
  variables:
    SAVESLOT_TEST_DURABILITY: host-fsync

check-26-static:
  extends: [.check-static, .check-26]

check-26-unit:
  extends: [.check-unit, .check-26]

check-26-prop:
  extends: [.check-prop, .check-26]

# Nightly and by hand (on the default branch): every property test file, round after round, each
# run with a fresh random seed, for about 50 minutes. A failed run leaves its seed, replay path and
# counterexample in soak/failures.md and its whole output beside it.
prop-soak:
  extends: [.pnpm, .full-only]
  image: node:24.22.3
  resource_group: saveslot-heavy
  tags: [fv-ci-hk-docker]
  timeout: 60 minutes
  variables:
    SOAK_MINUTES: "50"
    SOAK_RUN_MINUTES: "15"
  script:
    - runuser -u node -- env SAVESLOT_TEST_DURABILITY="${SAVESLOT_TEST_DURABILITY:-}" SOAK_MINUTES="$SOAK_MINUTES" SOAK_RUN_MINUTES="$SOAK_RUN_MINUTES" pnpm test:prop:soak
  artifacts:
    when: always
    expire_in: 30 days
    paths: [soak/]

# Nightly and by hand (on the default branch): the kernel's tests on a real store, the PostgreSQL
# backend's own and the replay across the two backends, on a PostgreSQL server
# (docs/zh-CN/spec/02-architecture.md §11 «测试矩阵»: both backends). `pnpm check` has no server and
# skips what needs one; here nothing may be skipped for want of it: the script fails without the
# variable, and a test that needs the server fails when it is not there.
#
# The server is a service of the job, so each run has its own and it is gone with the job. Its
# minor version is fixed: a new one is taken by changing it here, and seen in the run that follows.
# The cluster is made with the encoding and the locale the backend gives each tenant's database
# (§8); the backend does not rely on it, and names both itself when it creates a database. Nothing
# but this job can reach the server, so it asks for no password.
test-postgres:
  extends: [.pnpm, .full-only]
  image: node:24.22.3
  services:
    - name: postgres:18.7
      alias: postgres
  resource_group: saveslot-heavy
  tags: [fv-ci-hk-docker]
  timeout: 20 minutes
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C
    SAVESLOT_TEST_POSTGRES_URL: postgres://postgres@postgres:5432/postgres
  script:
    - runuser -u node -- env SAVESLOT_TEST_POSTGRES_URL="$SAVESLOT_TEST_POSTGRES_URL" pnpm test:postgres

# The passphrase encryption of an export against the age command line (docs/zh-CN/spec/06-cli.md
# §4.8 «导出的口令加密»): age opens what saveslot writes, and saveslot opens what age writes, with the
# passphrase given through age-plugin-batchpass. The test fails, not skips, without the two
# commands (SAVESLOT_TEST_AGE_REQUIRED). age is a tool of this test, not shipped: it is taken from
# its release page, pinned by version and by the archive's SHA-256 (checked once against the
# release's sigsum proof, as the age repository's SIGSUM.md describes). Distribution packages are too
# old (the batchpass plugin is in 1.3.0 and later). Light: not in the heavy resource group.
age-interop:
  extends: [.pnpm]
  image: node:24.22.3
  timeout: 15 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/cli/src/export-crypto*
        - pnpm-lock.yaml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/
  variables:
    AGE_VERSION: v1.3.2
    AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  before_script:
    - curl --fail --retry 3 -sSL -o /tmp/age.tgz "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
    - echo "${AGE_SHA256}  /tmp/age.tgz" | sha256sum -c -
    - tar xzf /tmp/age.tgz -C /usr/local/bin --strip-components=1 age/age age/age-plugin-batchpass
    - age --version
    - !reference [.pnpm, before_script]
  script:
    - runuser -u node -- env SAVESLOT_TEST_AGE_REQUIRED=1 pnpm exec vitest run packages/cli/src/export-crypto.test.ts

# Every commit in a merge request is signed off by its author (DCO).
dco:
  extends: [.git-as-root]
  image: node:24.22.3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  script:
    - node scripts/check-dco.ts "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

# The merge request title is a Conventional Commit: it becomes the squash commit's subject.
mr-title:
  image: node:24.22.3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - node scripts/check-mr-title.ts

# A project-held list of terms appears nowhere in tracked files, paths, the merge request's commit
# messages or title (the list is the masked variable SAVESLOT_FORBIDDEN_TERMS_B64; output names
# terms by index only); code and the spec cite spec sections, not ruling numbers.
forbidden-terms:
  extends: [.quick, .git-as-root]
  image: node:24.22.3
  variables:
    GIT_DEPTH: 0
  script:
    - node scripts/check-forbidden-terms.ts

# No secrets in the commits of a merge request, or anywhere in the history of the default branch.
# On a branch, only the history the checked-out commit reaches: without `--log-opts`, gitleaks scans
# every ref the runner's clone holds, other branches' commits among them.
secrets:
  extends: [.quick, .git-as-root]
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        gitleaks git --redact --verbose --log-opts="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD" .
      else
        gitleaks git --redact --verbose --log-opts="HEAD" .
      fi
