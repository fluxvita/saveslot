# CI only calls scripts from the repository (package.json), so the checks stay the same when the
# project moves to another CI platform. See docs/zh-CN/spec/02-architecture.md §11.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# `pnpm check`: type check, lint, unit and property tests, dependency rules, doc links, JSON examples.
check:
  # Runs take about 1.5 minutes. A hard bound from outside the test process: test-level limits
  # cannot preempt synchronous code, so a stalled run would otherwise hold the runner until the
  # project's default job timeout.
  timeout: 20 minutes
  parallel:
    matrix:
      - NODE_IMAGE: ["node:24", "node:latest"]
  image: $NODE_IMAGE
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - npm install --global pnpm@12.14.0
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm check

# Every commit in a merge request is signed off by its author (DCO).
dco:
  image: node:24
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  script:
    - node scripts/check-dco.ts "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

# The merge request title is a Conventional Commit: it becomes the squash commit's subject.
mr-title:
  image: node:24
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - node scripts/check-mr-title.ts

# A project-held list of terms appears nowhere in tracked files, paths, the merge request's commit
# messages or title (the list is the masked variable SAVESLOT_FORBIDDEN_TERMS_B64; output names
# terms by index only); code and the spec cite spec sections, not ruling numbers.
forbidden-terms:
  image: node:24
  variables:
    GIT_DEPTH: 0
  script:
    - node scripts/check-forbidden-terms.ts

# No secrets in the commits of a merge request, or anywhere in the history of the default branch.
secrets:
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        gitleaks git --redact --verbose --log-opts="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD" .
      else
        gitleaks git --redact --verbose .
      fi
