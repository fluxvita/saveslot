# Publishes to npm what a release branch's versions say and npm does not have yet (RELEASING.md).
# Runs after the `ci` workflow passed on a push to a release branch (`release/0.<minor>`), on the
# commit it checked; by hand to retry, on a release branch. Versions and tags are set on the release
# branch, so main never publishes. Publishes nothing in Changesets pre mode (prereleases are
# published by hand) or when the entry's version is already on npm, so every other push to a release
# branch ends after the first steps. Once a release is published, the `image` workflow builds and
# pushes its container image, tagged with the version and `latest`; `next` is pointed at the
# release, and the release's GitHub Release is created with notes from the packages' changelogs.
# GitHub runs a `workflow_run` workflow from the default branch's copy of this file, so a change to
# it takes effect once it is on main.

name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'fluxvita/saveslot' && ((github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/release/')) || (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the tags
      id-token: write # provenance
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: due
        run: |
          version="$(node -p 'require("./packages/saveslot/package.json").version')"
          if [ -e .changeset/pre.json ]; then
            echo "Changesets pre mode: prereleases are published by hand."
          elif npm view "@fluxvita/saveslot@${version}" version >/dev/null 2>&1; then
            echo "@fluxvita/saveslot@${version} is on npm already."
          else
            echo "Publishing ${version}."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.due.outputs.publish == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.due.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.due.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm smoke:install
      - id: publish
        if: steps.due.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm changeset publish
      - if: steps.due.outputs.publish == 'true'
        run: |
          git tag "v$(node -p 'require("./packages/saveslot/package.json").version')"
          git push origin --tags
      # `next` follows a release: `changeset publish` moves `latest` only, so `next` would stay on
      # the last prerelease and `@next` would be older than `@latest` (RELEASING.md).
      - if: steps.publish.outcome == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p 'require("./packages/saveslot/package.json").version')"
          for f in packages/*/package.json; do
            name="$(node -p 'const p = require("./" + process.argv[1]); p.private ? "" : p.name' "$f")"
            if [ -n "$name" ]; then npm dist-tag add "${name}@${version}" next; fi
          done
      # The GitHub Release of the tag, its notes gathered from the published packages' changelogs:
      # each entry once, without the lines that only bump a dependency.
      - if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./packages/saveslot/package.json").version')"
          for f in packages/*/package.json; do
            if node -e 'process.exit(require("./" + process.argv[1]).private ? 1 : 0)' "$f"; then
              awk -v v="## ${version}" '$0 == v { on = 1; next } on && /^## / { exit } on' \
                "$(dirname "$f")/CHANGELOG.md"
            fi
          done |
            grep -v -e '^### ' -e '^- Updated dependencies' -e '^ *- @fluxvita/' \
              -e '^No changes in this release' |
            awk 'NF == 0 { next } !seen[$0]++' > "$RUNNER_TEMP/notes.md"
          gh release create "v${version}" --verify-tag --title "v${version}" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest

  image:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: read
      packages: write # the image on ghcr.io
      id-token: write # its provenance attestation
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.publish.outputs.sha }}
      latest: true
